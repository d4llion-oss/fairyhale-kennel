# DigitalOcean App Platform spec — mirrors the live app (id a2dd7acd-…).
# Update the live app with:   doctl apps update <app-id> --spec .do/app.yaml
# SESSION_SECRET / ADMIN_PASSWORD are stored encrypted in the live spec (EV[…]);
# keep the placeholders here and set real values in the DO console.
#
# Note: App Platform "dev databases" on Postgres 15+ connect as a non-owner
# role with no CREATE rights, so the app uses an attached managed cluster.

name: fairyhale-kennel
region: nyc

databases:
  - name: fairyhale-kennel-db
    cluster_name: fairyhale-kennel-db   # managed Postgres cluster, attached as trusted source
    engine: PG
    version: "18"
    production: true

services:
  - name: fairyhale-kennel
    github:
      repo: d4llion-oss/fairyhale-kennel
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 8080
    health_check:
      http_path: /healthz
      initial_delay_seconds: 15
    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: ${fairyhale-kennel-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        value: ${fairyhale-kennel-db.CA_CERT}
      - key: SESSION_SECRET
        type: SECRET
        value: "SET_IN_CONSOLE"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        type: SECRET
        value: "SET_IN_CONSOLE"
      - key: SEED_DEMO_DATA
        value: "false"

ingress:
  rules:
    - component:
        name: fairyhale-kennel
      match:
        path:
          prefix: /

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
