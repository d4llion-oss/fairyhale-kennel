name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fairyhale
          POSTGRES_PASSWORD: fairyhale
          POSTGRES_DB: fairyhale_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fairyhale"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fairyhale:fairyhale@localhost:5432/fairyhale_test
      SESSION_SECRET: ci-only
      ADMIN_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run seed
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fairyhale-kennel:ci .

# Deployment is handled by DigitalOcean App Platform, which watches the main
# branch of this repo and rebuilds the Dockerfile on every push (deploy_on_push).
