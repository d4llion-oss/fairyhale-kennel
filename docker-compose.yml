# Local development: `docker compose up --build`
# Then: docker compose exec app npm run migrate && docker compose exec app npm run seed
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fairyhale
      POSTGRES_PASSWORD: fairyhale
      POSTGRES_DB: fairyhale
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairyhale"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://fairyhale:fairyhale@db:5432/fairyhale
      SESSION_SECRET: change-me-locally-only
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ChangeMe-Now-1234
      SEED_DEMO_DATA: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
